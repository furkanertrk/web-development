<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beden Kitle Endeksi Hesapla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Beden Kitle Endeksi (BMI) Hesaplayıcı</h1>
        <form id="bmiForm">
            <div class="form-group">
                <label for="weight">Kilo (kg):</label>
                <input type="number" id="weight" name="weight" placeholder="Örn: 70" required>
            </div>
            <div class="form-group">
                <label for="height">Boy (cm):</label>
                <input type="number" id="height" name="height" placeholder="Örn: 175" required>
            </div>
            <button type="submit">Hesapla</button>
        </form>
        <h2 id="result"></h2>
    </div>
    <script src="app.js"></script>
</body>
</html>
